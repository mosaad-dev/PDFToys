name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/PDFToys.Core/PDFToys.Core.csproj
          dotnet restore tests/PDFToys.Core.Tests/PDFToys.Core.Tests.csproj
          dotnet restore src/PDFToys.App/PDFToys.App.csproj
          dotnet restore tests/PDFToys.App.Tests/PDFToys.App.Tests.csproj

      - name: Build
        run: |
          dotnet build src/PDFToys.Core/PDFToys.Core.csproj --configuration Release --no-restore
          dotnet build tests/PDFToys.Core.Tests/PDFToys.Core.Tests.csproj --configuration Release --no-restore
          dotnet build src/PDFToys.App/PDFToys.App.csproj --configuration Release --no-restore
          dotnet build tests/PDFToys.App.Tests/PDFToys.App.Tests.csproj --configuration Release --no-restore

      - name: Test Core
        run: dotnet test tests/PDFToys.Core.Tests/PDFToys.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test App
        run: dotnet test tests/PDFToys.App.Tests/PDFToys.App.Tests.csproj --configuration Release --no-build --verbosity normal

  shell-extension:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Build Shell Extension
        run: msbuild src/PDFToys.ShellExtension/PDFToys.ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64
